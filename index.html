<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Assignment Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  :root {
    --color-canvas: #FAF5EC;
    --color-surface: #FFFFFF;
    --color-surface-alt: #F3ECDF;
    --color-border: #E1D6C2;
    --color-border-strong: #CBBB9C;
    --color-ink: #2B241C;
    --color-ink-muted: #6B5E4C;
    --color-accent: #B85C2E;
    --color-accent-ink: #FFFFFF;
    --color-accent-soft: #F0DCC9;
    --color-danger: #A8402A;
    --color-danger-soft: #F4DCD3;
    --color-sup1: #B33A2E;
    --color-sup1-ink: #FFFFFF;
    --color-sup2: #B8862B;
    --color-sup2-ink: #241C0E;
    --color-sup3: #3E7C4A;
    --color-sup3-ink: #FFFFFF;
    --color-sup4: #2F5FA8;
    --color-sup4-ink: #FFFFFF;
    --color-sup5: #B85C8A;
    --color-sup5-ink: #FFFFFF;
    --color-sup6: #7A756A;
    --color-sup6-ink: #FFFFFF;
    --color-sup7: #C1600A;
    --color-sup7-ink: #FFFFFF;
    --color-empty-bg: #F3ECDF;
    --color-empty-border: #D8CBAF;
    --color-focus: #1F6F6F;
    --shadow-sm: 0 1px 2px rgba(43, 36, 28, 0.10);
    --shadow-md: 0 6px 18px rgba(43, 36, 28, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 18px;

    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

    --text-xs: 0.72rem;
    --text-sm: 0.82rem;
    --text-base: 0.94rem;
    --text-md: 1.05rem;
    --text-lg: 1.3rem;
    --text-xl: 1.85rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-canvas: #1C1712;
      --color-surface: #241E17;
      --color-surface-alt: #2C251C;
      --color-border: #40372A;
      --color-border-strong: #574A37;
      --color-ink: #F1E8DA;
      --color-ink-muted: #B7A98F;
      --color-accent: #E2894F;
      --color-accent-ink: #241004;
      --color-accent-soft: #3E2E1E;
      --color-danger: #E2694A;
      --color-danger-soft: #3C241C;
      --color-sup1: #E2776B;
      --color-sup1-ink: #2A0D08;
      --color-sup2: #DDAA4C;
      --color-sup2-ink: #241A05;
      --color-sup3: #6FBF7B;
      --color-sup3-ink: #0C2210;
      --color-sup4: #7FB2E8;
      --color-sup4-ink: #0B2036;
      --color-sup5: #E79DC0;
      --color-sup5-ink: #33091E;
      --color-sup6: #A39C8C;
      --color-sup6-ink: #1C1712;
      --color-sup7: #E8985A;
      --color-sup7-ink: #241004;
      --color-empty-bg: #2C251C;
      --color-empty-border: #443A2B;
      --color-focus: #7ED0CA;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --color-canvas: #1C1712;
    --color-surface: #241E17;
    --color-surface-alt: #2C251C;
    --color-border: #40372A;
    --color-border-strong: #574A37;
    --color-ink: #F1E8DA;
    --color-ink-muted: #B7A98F;
    --color-accent: #E2894F;
    --color-accent-ink: #241004;
    --color-accent-soft: #3E2E1E;
    --color-danger: #E2694A;
    --color-danger-soft: #3C241C;
    --color-sup1: #E2776B;
    --color-sup1-ink: #2A0D08;
    --color-sup2: #DDAA4C;
    --color-sup2-ink: #241A05;
    --color-sup3: #6FBF7B;
    --color-sup3-ink: #0C2210;
    --color-sup4: #7FB2E8;
    --color-sup4-ink: #0B2036;
    --color-sup5: #E79DC0;
    --color-sup5-ink: #33091E;
    --color-sup6: #A39C8C;
    --color-sup6-ink: #1C1712;
    --color-sup7: #E8985A;
    --color-sup7-ink: #241004;
    --color-empty-bg: #2C251C;
    --color-empty-border: #443A2B;
    --color-focus: #7ED0CA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 12px 28px;
  }

  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

  .page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--color-canvas);
    padding-block: 10px;
    margin-inline: -16px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 600;
  }
  .page-title { font-size: var(--text-xl); font-weight: 600; color: var(--color-ink); }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand-logo { height: 60px; width: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo {
      background: #FFFFFF;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
  }
  :root[data-theme="dark"] .brand-logo {
    background: #FFFFFF;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    border: 1px solid transparent;
    cursor: pointer;
    min-height: 40px;
    transition: filter 0.12s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; filter: none; }

  .btn-sm { min-height: 34px; padding: 6px 12px; font-size: var(--text-xs); }

  .btn-primary { background: var(--color-accent); color: var(--color-accent-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

  .btn-ghost-danger {
    background: transparent;
    color: var(--color-danger);
    border-color: var(--color-danger);
  }
  .btn-ghost-danger:hover:not(:disabled) { background: var(--color-danger-soft); }

  /* ---------- status banner ---------- */
  .status-banner {
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: var(--text-sm);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--color-border);
  }
  .status-banner[hidden] {
    display: none;
  }
  .status-banner::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: currentColor;
  }
  .status-info { background: var(--color-surface-alt); color: var(--color-ink-muted); border-color: var(--color-border); }
  .status-info::before { animation: pulse 1.6s ease-in-out infinite; }
  .status-warning { background: var(--color-accent-soft); color: var(--color-accent); border-color: var(--color-accent); }
  .status-error { background: var(--color-danger-soft); color: var(--color-danger); border-color: var(--color-danger); }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-info::before { animation: none; }
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* ---------- org chart: crew ---------- */
  .crew {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .crew-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    flex: none;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .swatch-sup1 { background: var(--color-sup1); }
  .swatch-sup2 { background: var(--color-sup2); }
  .swatch-sup3 { background: var(--color-sup3); }
  .swatch-sup4 { background: var(--color-sup4); }
  .swatch-sup5 { background: var(--color-sup5); }
  .swatch-sup6 { background: var(--color-sup6); }
  .swatch-sup7 { background: var(--color-sup7); }

  .crew-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .field-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-ink-muted);
    font-weight: 600;
  }
  .crew-input {
    font-family: var(--font-body);
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--color-ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
    min-width: 0;
    width: 100%;
  }
  .crew-input:hover:not(:disabled) { border-bottom-color: var(--color-border-strong); }
  .crew-input:focus { outline: none; border-bottom-color: var(--color-focus); }
  .crew-input:disabled { color: var(--color-ink-muted); }

  .crew-lead-card {
    width: 100%;
    flex: 0 0 auto;
    padding: 9px 12px;
  }
  .crew-lead-card .swatch { width: 18px; height: 18px; }
  .crew-lead-card .crew-input { font-size: var(--text-sm); }

  .crew-sub-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-left: 14px;
    padding-left: 16px;
    border-left: 3px solid var(--color-border-strong);
  }
  .supervisor-branch {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .branch-stack {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .branch-stack .supervisor-branch { flex: none; }
  .supervisor-branch .crew-card {
    padding: 9px 12px;
  }
  .supervisor-branch .swatch { width: 18px; height: 18px; }
  .supervisor-branch .crew-input { font-size: var(--text-sm); }

  /* ---------- job foremen ---------- */
  .foreman-column {
    margin-left: 12px;
    padding-left: 14px;
    border-left: 2px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .foreman-list { display: flex; flex-direction: column; gap: 6px; }
  .foreman-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    box-shadow: var(--shadow-sm);
  }
  .foreman-box-sup2 { border-left-color: var(--color-sup2); }
  .foreman-box-sup3 { border-left-color: var(--color-sup3); }
  .foreman-box-sup4 { border-left-color: var(--color-sup4); }
  .foreman-box-sup7 { border-left-color: var(--color-sup7); }
  .foreman-name-text { font-weight: 600; font-size: var(--text-sm); overflow-wrap: anywhere; }
  .foreman-empty {
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    font-style: italic;
    padding: 4px 2px;
  }

  .add-foreman-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; margin-top: 2px; }
  .add-foreman-form input[type="text"] {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    min-height: 34px;
    width: 100%;
    max-width: 220px;
  }
  .add-foreman-form input[type="text"]:focus { outline: 2px solid var(--color-focus); outline-offset: 1px; }
  .add-foreman-form input[type="text"]:disabled { opacity: 0.55; }
  .field-error {
    font-size: var(--text-xs);
    color: var(--color-danger);
    margin: 0;
    flex-basis: 100%;
  }

  /* ---------- forecast range control ---------- */
  .forecast-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
  }
  .forecast-label {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.04em;
    color: var(--color-ink-muted);
    font-weight: 600;
  }
  .forecast-nav { display: flex; gap: 6px; align-items: center; }
  .forecast-nav-btn {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    min-height: 30px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
  }
  .forecast-nav-btn:hover:not(:disabled) { background: var(--color-accent-soft); }
  .forecast-nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- schedule (per-person forecast) ---------- */
  .foreman-entry { display: flex; flex-direction: column; gap: 6px; }
  .schedule-toggle-btn {
    flex: none;
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 5px 9px;
    min-height: 24px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink-muted);
    cursor: pointer;
  }
  .schedule-toggle-btn:hover:not(:disabled) { background: var(--color-accent-soft); color: var(--color-accent); }
  .schedule-toggle-btn.is-open { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
  .schedule-toggle-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .schedule-panel {
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .schedule-week { display: flex; flex-direction: column; gap: 4px; }
  .schedule-week-label {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-ink-muted);
  }
  .schedule-day-card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .schedule-day-label { font-size: var(--text-xs); font-weight: 700; color: var(--color-ink-muted); cursor: grab; user-select: none; touch-action: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .schedule-day-card { position: relative; transition: outline-color 0.05s ease; outline: 2px solid transparent; outline-offset: 1px; }
  .schedule-day-card.is-fill-source { outline-color: var(--color-focus); }
  .schedule-day-card.is-fill-target { outline-color: var(--color-focus); outline-style: dashed; }
  .schedule-field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 8px;
  }
  .schedule-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .schedule-field.span-2 { grid-column: 1 / -1; }
  .schedule-field-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-muted);
    font-weight: 600;
  }
  .schedule-field input {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    min-height: 30px;
    width: 100%;
  }
  .schedule-field input:focus { outline: 2px solid var(--color-focus); outline-offset: 1px; }
  .schedule-field input:disabled { opacity: 0.55; }
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-mark">Plumcore Plumbing Field OPS</span>
      <div class="title-row">
        <h1 class="page-title">Assignment Board</h1>
      </div>

  // Stable color per job name, so a day's card always matches the color of
  // its job, and changes color whenever the job name changes.
  var JOB_HUES = [28, 190, 265, 340, 100, 210, 45, 305, 150, 5];
  function hashString(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function colorForJobName(jobName) {
    var key = (jobName || '').trim().toLowerCase();
    if (!key) return null;
    var hue = JOB_HUES[hashString(key) % JOB_HUES.length];
    return { bg: 'hsla(' + hue + ', 55%, 55%, 0.18)', border: 'hsl(' + hue + ', 50%, 45%)' };
  }

  function q(id) { return document.getElementById(id); }

  function enqueueWrite(fn) {
    writeChain = writeChain.then(fn, fn);
    return writeChain;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function cloneForemen(f) {
    return { sup2: (f.sup2 || []).slice(), sup3: (f.sup3 || []).slice(), sup4: (f.sup4 || []).slice() };
  }

  // Each person's forecast schedule lives in its own "schedules/<slug>"
  // document (not the main board doc), so it can carry a looser write
  // rule: any signed-in viewer can fill it in, while the org chart itself
  // (names, foremen) stays admin-only.
  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, '-');
  }

  function cloneDayMap(days) {
    var out = {};
    Object.keys(days || {}).forEach(function (dk) {
      var e = days[dk] || {};
      out[dk] = {
        jobName: typeof e.jobName === 'string' ? e.jobName : '',
        po: typeof e.po === 'string' ? e.po : '',
        address: typeof e.address === 'string' ? e.address : '',
        stage: typeof e.stage === 'string' ? e.stage : ''
      };
    });
    return out;
  }

  var dbHandle = null;
  var scheduleDocsCache = {};
  var scheduleSubs = {};
  var authReadyResolve = null;
  var authReady = new Promise(function (res) { authReadyResolve = res; });
  var scheduleReadyResolvers = {};
  var scheduleReadyPromises = {};
  var lastWriteError = '';

  function ensureScheduleSub(personKey) {
    if (scheduleSubs[personKey]) return;
    scheduleSubs[personKey] = true; // claim immediately so a second call can't double-queue
    scheduleReadyPromises[personKey] = new Promise(function (res) {
      scheduleReadyResolvers[personKey] = res;
    });
    authReady.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      scheduleSubs[personKey] = onSnapshot(ref, function (snap) {
        scheduleDocsCache[personKey] = snap.exists() ? cloneDayMap(snap.data()) : {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      }, function () {
        scheduleDocsCache[personKey] = scheduleDocsCache[personKey] || {};
        if (scheduleReadyResolvers[personKey]) { scheduleReadyResolvers[personKey](); scheduleReadyResolvers[personKey] = null; }
        render();
      });
    });
  }

  function inputForName(which) {
    if (which === 'sup1Name') return els.sup1Input;
    if (which === 'sup2Name') return els.sup2Input;
    if (which === 'sup3Name') return els.sup3Input;
    if (which === 'sup4Name') return els.sup4Input;
    if (which === 'sup5Name') return els.sup5Input;
    if (which === 'sup7Name') return els.sup7Input;
    return els.sup6Input;
  }

  function handleWriteError(err, opts) {
    opts = opts || {};
    if (err && err.code === 'permission-denied') {
      canEdit = false;
      if (opts.revertName) {
        state[opts.revertName] = confirmedNames[opts.revertName];
      }
    } else if (err && err.code === 'unauthenticated') {
      canEdit = false;
      disconnected = true;
    } else if (err && err.code === 'not-found') {
      triedInit = false;
      lastWriteError = "Couldn't save — the board record is missing. Reload the page.";
    } else if (err) {
      lastWriteError = "Couldn't save your change. Try again.";
    }
    // unavailable / resource-exhausted / deadline-exceeded / aborted:
    // transient — leave canEdit as-is.
    render();
  }

  // ---------------- DB wiring ----------------
  function boot() {
    render();
    // Watchdog on whether the FIRST snapshot ever arrives (not just whether
    // auth succeeded) — a Firestore listen can open its channel and then
    // never deliver data, and nothing used to catch that case.
    var dataTimer = setTimeout(function () {
      if (loaded) return;
      dbUnavailable = true; render();
    }, 15000);
    signInAnonymously(firebaseAuth).catch(function () {
      clearTimeout(dataTimer);
      dbUnavailable = true; loaded = true; render();
    });
    onAuthStateChanged(firebaseAuth, function (user) {
      if (!user) return;
      if (docRef) return; // already booted for this page load
      dbUnavailable = false;
      dbHandle = firestoreDb;
      docRef = doc(firestoreDb, 'board/week1');
      authReadyResolve();
      onSnapshot(docRef, function (snap) {
        clearTimeout(dataTimer);
        loaded = true;
        disconnected = false;
        if (snap.exists()) {
          var data = snap.data() || {};
          state.sup1Name = (typeof data.sup1Name === 'string' && data.sup1Name) ? data.sup1Name : SUP_FALLBACK.sup1Name;
          state.sup2Name = (typeof data.sup2Name === 'string' && data.sup2Name) ? data.sup2Name : SUP_FALLBACK.sup2Name;
          state.sup3Name = (typeof data.sup3Name === 'string' && data.sup3Name) ? data.sup3Name : SUP_FALLBACK.sup3Name;
          state.sup4Name = (typeof data.sup4Name === 'string' && data.sup4Name) ? data.sup4Name : SUP_FALLBACK.sup4Name;
          state.sup5Name = (typeof data.sup5Name === 'string' && data.sup5Name) ? data.sup5Name : SUP_FALLBACK.sup5Name;
          state.sup6Name = (typeof data.sup6Name === 'string' && data.sup6Name) ? data.sup6Name : SUP_FALLBACK.sup6Name;
          state.sup7Name = (typeof data.sup7Name === 'string' && data.sup7Name) ? data.sup7Name : 'Charlie Cheetum';
          var f = (data.foremen && typeof data.foremen === 'object') ? data.foremen : {};
          state.foremen = {
            sup2: Array.isArray(f.sup2) ? f.sup2.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup3: Array.isArray(f.sup3) ? f.sup3.filter(function (t) { return typeof t === 'string' && t; }) : [],
            sup4: Array.isArray(f.sup4) ? f.sup4.filter(function (t) { return typeof t === 'string' && t; }) : []
          };
          confirmedNames.sup1Name = state.sup1Name;
          confirmedNames.sup2Name = state.sup2Name;
          confirmedNames.sup3Name = state.sup3Name;
          confirmedNames.sup4Name = state.sup4Name;
          confirmedNames.sup5Name = state.sup5Name;
          confirmedNames.sup6Name = state.sup6Name;
          confirmedNames.sup7Name = state.sup7Name;
        } else if (!triedInit) {
          triedInit = true;
          setDoc(docRef, {
            sup1Name: state.sup1Name,
            sup2Name: state.sup2Name,
            sup3Name: state.sup3Name,
            sup4Name: state.sup4Name,
            sup5Name: state.sup5Name,
            sup6Name: state.sup6Name,
            sup7Name: state.sup7Name,
            foremen: state.foremen
          }).catch(function (err) { handleWriteError(err); });
        }
        render();
      }, function (err) {
        clearTimeout(dataTimer);
        if (!loaded) { dbUnavailable = true; } else { disconnected = true; }
        render();
      });
    });
  }

  // ---------------- Write actions ----------------
  function saveSupName(which) {
    var raw = inputForName(which).value;
    var fallback = SUP_FALLBACK[which];
    var v = raw.trim().slice(0, 40) || fallback;
    state[which] = v;
    render();
    var patch = {}; patch[which] = v;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, patch).catch(function (err) { handleWriteError(err, { revertName: which }); });
      });
    });
  }

  function onSupInput(which, value) {
    state[which] = value;
    render();
    clearTimeout(nameDebounce[which]);
    nameDebounce[which] = setTimeout(function () { saveSupName(which); }, 500);
  }

  function addForeman(supKey, name, errorEl) {
    var v = name.trim().slice(0, 40);
    errorEl.hidden = true;
    if (!v) return;
    var list = state.foremen[supKey] || [];
    if (list.indexOf(v) !== -1) {
      errorEl.textContent = v + ' is already listed under this supervisor.';
      errorEl.hidden = false;
      return;
    }
    var merged = cloneForemen(state.foremen);
    merged[supKey] = list.concat([v]);
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function removeForeman(supKey, name) {
    var merged = cloneForemen(state.foremen);
    merged[supKey] = (merged[supKey] || []).filter(function (n) { return n !== name; });
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: merged }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function clearAllForemen() {
    if (!window.confirm('Remove all Job Foremen from every supervisor? This cannot be undone.')) return;
    lastWriteError = '';
    authReady.then(function () {
      enqueueWrite(function () {
        return updateDoc(docRef, { foremen: { sup2: [], sup3: [], sup4: [] } }).catch(function (err) { handleWriteError(err); });
      });
    });
  }

  function saveScheduleEntry(personKey, dk, fields) {
    var readyPromise = scheduleReadyPromises[personKey];
    if (!dbHandle || !readyPromise) return; // panel was never opened via ensureScheduleSub; shouldn't happen from the UI
    var jobName = (fields.jobName || '').trim().slice(0, 60);
    var po = (fields.po || '').trim().slice(0, 30);
    var address = (fields.address || '').trim().slice(0, 100);
    var stage = (fields.stage || '').trim().slice(0, 60);
    var isEmpty = !jobName && !po && !address && !stage;
    readyPromise.then(function () {
      var ref = doc(dbHandle, 'schedules', slugify(personKey));
      var localDayMap = cloneDayMap(scheduleDocsCache[personKey]);
      var patch = {};
      if (isEmpty) {
        delete localDayMap[dk];
        patch[dk] = deleteField();
      } else {
        localDayMap[dk] = { jobName: jobName, po: po, address: address, stage: stage };
        patch[dk] = localDayMap[dk];
      }
      scheduleDocsCache[personKey] = localDayMap;
      lastWriteError = '';
      enqueueWrite(function () {
        return setDoc(ref, patch, { merge: true }).catch(function (err) { handleScheduleWriteError(err); });
      });
    });
  }

  // Schedule writes use their own (looser) rule, so a rejection here
  // means connectivity/lifecycle trouble, not an admin-only board edit —
  // never flips the board's canEdit flag.
  function handleScheduleWriteError(err) {
    if (err && err.code === 'unauthenticated') {
      disconnected = true;
    } else if (err && err.code === 'permission-denied') {
      lastWriteError = "Couldn't save this schedule entry — you may not have edit access.";
    } else if (err) {
      lastWriteError = "Couldn't save this schedule entry. Try again.";
    }
    render();
  }

  function togglePerson(personKey) {
    expandedPersons[personKey] = !expandedPersons[personKey];
    if (expandedPersons[personKey]) ensureScheduleSub(personKey);
    render();
  }

  function shiftForecast(weeks) {
    forecastStart = addDays(forecastStart, weeks * 7);
    render();
  }

  function resetForecastToToday() {
    forecastStart = mondayOf(new Date());
    render();
  }

  // ---------------- Rendering ----------------
  function renderStatusBanner() {
    var banner = els.statusBanner;
    if (lastWriteError) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = lastWriteError;
      return;
    }
    if (dbUnavailable) {
      banner.hidden = false;
      banner.className = 'status-banner status-error';
      banner.textContent = "Can't connect to the shared board right now. Check your connection and reopen this page.";
      return;
    }
    if (disconnected) {
      banner.hidden = false;
      banner.className = 'status-banner status-warning';
      banner.textContent = 'Connection lost — showing the last saved version. Reopen the page to reconnect.';
      return;
    }
    if (!loaded) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'Connecting to the shared board…';
      return;
    }
    if (!canEdit) {
      banner.hidden = false;
      banner.className = 'status-banner status-info';
      banner.textContent = 'View only — ask your project manager for edit access to make changes here.';
      return;
    }
    banner.hidden = true;
  }

  function syncCrewInputs() {
    if (document.activeElement !== els.sup1Input) els.sup1Input.value = state.sup1Name;
    if (document.activeElement !== els.sup2Input) els.sup2Input.value = state.sup2Name;
    if (document.activeElement !== els.sup3Input) els.sup3Input.value = state.sup3Name;
    if (document.activeElement !== els.sup4Input) els.sup4Input.value = state.sup4Name;
    if (document.activeElement !== els.sup5Input) els.sup5Input.value = state.sup5Name;
    if (document.activeElement !== els.sup6Input) els.sup6Input.value = state.sup6Name;
    if (document.activeElement !== els.sup7Input) els.sup7Input.value = state.sup7Name;
    var disable = !canEdit || dbUnavailable;
    els.sup1Input.disabled = disable;
    els.sup2Input.disabled = disable;
    els.sup3Input.disabled = disable;
    els.sup4Input.disabled = disable;
    els.sup5Input.disabled = disable;
    els.sup6Input.disabled = disable;
    els.sup7Input.disabled = disable;
  }

  // ---------------- Drag-to-fill across days ----------------
  // Type a day's fields, then press-and-drag its date label across other
  // day cards in the same calendar to copy those fields onto every day
  // the drag passes over (like a spreadsheet fill handle).
  function clearFillHighlight(days) {
    days.forEach(function (d) { d.card.classList.remove('is-fill-source', 'is-fill-target'); });
  }

  function updateFillRange(curIdx) {
    var st = fillDragState;
    if (!st) return;
    var lo = Math.min(st.sourceIdx, curIdx);
    var hi = Math.max(st.sourceIdx, curIdx);
    st.days.forEach(function (d, idx) {
      d.card.classList.remove('is-fill-source', 'is-fill-target');
      if (idx === st.sourceIdx) {
        d.card.classList.add('is-fill-source');
      } else if (idx >= lo && idx <= hi) {
        d.card.classList.add('is-fill-target');
      }
    });
    st.currentIdx = curIdx;
  }

  function onFillMouseUp() {
    var st = fillDragState;
    document.removeEventListener('mouseup', onFillMouseUp);
    document.removeEventListener('touchmove', onFillTouchMove);
    document.removeEventListener('touchend', onFillMouseUp);
    document.removeEventListener('touchcancel', onFillMouseUp);
    if (!st) return;
    var lo = Math.min(st.sourceIdx, st.currentIdx);
    var hi = Math.max(st.sourceIdx, st.currentIdx);
    for (var i = lo; i <= hi; i++) {
      if (i === st.sourceIdx) continue;
      var d = st.days[i];
      d.jobNameInput.value = st.values.jobName;
      d.poInput.value = st.values.po;
      d.addressInput.value = st.values.address;
      d.stageInput.value = st.values.stage;
      d.applyCardColor(st.values.jobName);
      saveScheduleEntry(st.personKey, d.dk, st.values);
    }
    clearFillHighlight(st.days);
    fillDragState = null;
  }

  function startFillDrag(personKey, days, sourceIdx) {
    if (fillDragState) onFillMouseUp();
    var source = days[sourceIdx];
    fillDragState = {
      personKey: personKey,
      days: days,
      sourceIdx: sourceIdx,
      currentIdx: sourceIdx,
      values: {
        jobName: source.jobNameInput.value,
        po: source.poInput.value,
        address: source.addressInput.value,
        stage: source.stageInput.value
      }
    };
    source.card.classList.add('is-fill-source');
    document.addEventListener('mouseup', onFillMouseUp);
    document.addEventListener('touchmove', onFillTouchMove, { passive: false });
    document.addEventListener('touchend', onFillMouseUp);
    document.addEventListener('touchcancel', onFillMouseUp);
  }

  // Touch equivalent of the mouseenter-based range update above: touch
  // events don't fire "enter" on the elements underneath a moving finger,
  // so on every touchmove we look up what's under the touch point and
  // update the highlighted range from that.
  function onFillTouchMove(e) {
    var st = fillDragState;
    if (!st || !e.touches || !e.touches[0]) return;
    e.preventDefault();
    var touch = e.touches[0];
    var el = document.elementFromPoint(touch.clientX, touch.clientY);
    var cardEl = el && el.closest ? el.closest('.schedule-day-card') : null;
    if (!cardEl) return;
    var idx = parseInt(cardEl.dataset.fillIdx, 10);
    if (!isNaN(idx) && idx >= 0 && idx < st.days.length) {
      updateFillRange(idx);
    }
  }

  function wireDragFill(days, personKey, disableControls) {
    if (disableControls) return;
    days.forEach(function (d, idx) {
      d.dayLabel.addEventListener('mousedown', function (e) {
        e.preventDefault();
        startFillDrag(personKey, days, idx);
      });
      d.dayLabel.addEventListener('touchstart', function (e) {
        e.preventDefault();
        startFillDrag(personKey, days, idx);
      }, { passive: false });
      d.card.addEventListener('mouseenter', function () {
        if (fillDragState && fillDragState.personKey === personKey) {
          updateFillRange(idx);
        }
      });
    });
  }

  function buildCalendarPanel(personKey, disableControls) {
    var panel = document.createElement('div');
    panel.className = 'schedule-panel';
    var entries = scheduleDocsCache[personKey] || {};
    var panelDays = [];

    for (var w = 0; w < WEEKS_TO_SHOW; w++) {
      var weekStart = addDays(forecastStart, w * 7);
      var weekBlock = document.createElement('div');
      weekBlock.className = 'schedule-week';
      var weekLabel = document.createElement('div');
      weekLabel.className = 'schedule-week-label';
      weekLabel.textContent = 'Week of ' + fmtShortDate(weekStart);
      weekBlock.appendChild(weekLabel);

      for (var d = 0; d < 5; d++) {
        (function () {
          var date = addDays(weekStart, d);
          var dk = dateKey(date);
          var entry = entries[dk] || { jobName: '', po: '', address: '', stage: '' };

          var card = document.createElement('div');
          card.className = 'schedule-day-card';

          function applyCardColor(jobName) {
            var c = colorForJobName(jobName);
            if (c) {
              card.style.background = c.bg;
              card.style.borderLeft = '4px solid ' + c.border;
            } else {
              card.style.background = '';
              card.style.borderLeft = '';
            }
          }
          applyCardColor(entry.jobName);

          var dayLabel = document.createElement('div');
          dayLabel.className = 'schedule-day-label';
          dayLabel.textContent = fmtDayLabel(date);
          card.appendChild(dayLabel);

          var grid = document.createElement('div');
          grid.className = 'schedule-field-grid';

          function makeField(labelText, value, maxLen, spanFull) {
            var wrap = document.createElement('div');
            wrap.className = 'schedule-field' + (spanFull ? ' span-2' : '');
            var lbl = document.createElement('span');
            lbl.className = 'schedule-field-label';
            lbl.textContent = labelText;
            wrap.appendChild(lbl);
            var input = document.createElement('input');
            input.type = 'text';
            input.maxLength = maxLen;
            input.value = value;
            input.disabled = disableControls;
            wrap.appendChild(input);
            grid.appendChild(wrap);
            return input;
          }

          var jobNameInput = makeField('Job Name', entry.jobName, 60, false);
          var poInput = makeField('PO #', entry.po, 30, false);
          var addressInput = makeField('Address', entry.address, 100, true);
          var stageInput = makeField('Stage of Work', entry.stage, 60, true);

          var save = function () {
            saveScheduleEntry(personKey, dk, {
              jobName: jobNameInput.value,
              po: poInput.value,
              address: addressInput.value,
              stage: stageInput.value
            });
          };
          jobNameInput.addEventListener('input', function () { applyCardColor(jobNameInput.value); });
          jobNameInput.addEventListener('blur', save);
          poInput.addEventListener('blur', save);
          addressInput.addEventListener('blur', save);
          stageInput.addEventListener('blur', save);

          card.appendChild(grid);
          weekBlock.appendChild(card);

          card.dataset.fillIdx = String(panelDays.length);
          panelDays.push({
            dk: dk,
            card: card,
            dayLabel: dayLabel,
            jobNameInput: jobNameInput,
            poInput: poInput,
            addressInput: addressInput,
            stageInput: stageInput,
            applyCardColor: applyCardColor
          });
        })();
      }
      panel.appendChild(weekBlock);
    }
    wireDragFill(panelDays, personKey, disableControls);
    return panel;
  }

  function renderScheduleSlot(slotEl, toggleBtn, personKey, disableControls) {
    var isOpen = !!expandedPersons[personKey];
    toggleBtn.textContent = isOpen ? 'Hide schedule' : 'Schedule';
    toggleBtn.classList.toggle('is-open', isOpen);
    toggleBtn.disabled = dbUnavailable;
    if (slotEl.contains(document.activeElement)) return;
    slotEl.innerHTML = '';
    if (isOpen) {
      slotEl.appendChild(buildCalendarPanel(personKey, disableControls));
    }
  }

  function renderForemen() {
    var disableControls = !canEdit || dbUnavailable;
    var scheduleDisable = dbUnavailable;

    SUP_KEYS.forEach(function (supKey) {
      var listEl = els.foremanList[supKey];
      listEl.innerHTML = '';
      var names = state.foremen[supKey] || [];

      if (!names.length) {
        var empty = document.createElement('p');
        empty.className = 'foreman-empty';
        empty.textContent = loaded ? 'No Job Foremen yet.' : 'Loading…';
        listEl.appendChild(empty);
      } else {
        names.forEach(function (name) {
          var personKey = 'foreman:' + supKey + ':' + name;

          var entryWrap = document.createElement('div');
          entryWrap.className = 'foreman-entry';

          var box = document.createElement('div');
          box.className = 'foreman-box foreman-box-' + supKey;
          var nameSpan = document.createElement('span');
          nameSpan.className = 'foreman-name-text';
          nameSpan.textContent = name;
          box.appendChild(nameSpan);

          var scheduleBtn = document.createElement('button');
          scheduleBtn.type = 'button';
          scheduleBtn.className = 'schedule-toggle-btn';
          var isOpen = !!expandedPersons[personKey];
          scheduleBtn.textContent = isOpen ? 'Hide schedule' : 'Schedule';
          if (isOpen) scheduleBtn.classList.add('is-open');
          scheduleBtn.disabled = dbUnavailable;
          scheduleBtn.addEventListener('click', function () { togglePerson(personKey); });
          box.appendChild(scheduleBtn);

          entryWrap.appendChild(box);
          if (isOpen) {
            entryWrap.appendChild(buildCalendarPanel(personKey, scheduleDisable));
          }
          listEl.appendChild(entryWrap);
        });
      }
    });
  }

  function renderForecastBar() {
    var endDate = addDays(forecastStart, (WEEKS_TO_SHOW - 1) * 7 + 4);
    els.forecastRangeLabel.textContent = fmtShortDate(forecastStart) + ' – ' + fmtShortDate(endDate);
  }

  function render() {
    renderStatusBanner();
    syncCrewInputs();
    renderForemen();
    renderForecastBar();
    var scheduleDisable = dbUnavailable;
    renderScheduleSlot(els.schedulePanelSlot.sup4, els.scheduleToggle.sup4, 'sup4', scheduleDisable);
    renderScheduleSlot(els.schedulePanelSlot.sup5, els.scheduleToggle.sup5, 'sup5', scheduleDisable);
    renderScheduleSlot(els.schedulePanelSlot.sup6, els.scheduleToggle.sup6, 'sup6', scheduleDisable);
    renderScheduleSlot(els.schedulePanelSlot.sup7, els.scheduleToggle.sup7, 'sup7', scheduleDisable);
  }

  function wireStaticControls() {
    els.sup1Input.addEventListener('input', function (e) { onSupInput('sup1Name', e.target.value); });
    els.sup2Input.addEventListener('input', function (e) { onSupInput('sup2Name', e.target.value); });
    els.sup3Input.addEventListener('input', function (e) { onSupInput('sup3Name', e.target.value); });
    els.sup4Input.addEventListener('input', function (e) { onSupInput('sup4Name', e.target.value); });
    els.sup5Input.addEventListener('input', function (e) { onSupInput('sup5Name', e.target.value); });
    els.sup6Input.addEventListener('input', function (e) { onSupInput('sup6Name', e.target.value); });
    els.sup7Input.addEventListener('input', function (e) { onSupInput('sup7Name', e.target.value); });
    els.sup1Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup1Name); saveSupName('sup1Name'); });
    els.sup2Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup2Name); saveSupName('sup2Name'); });
    els.sup3Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup3Name); saveSupName('sup3Name'); });
    els.sup4Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup4Name); saveSupName('sup4Name'); });
    els.sup5Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup5Name); saveSupName('sup5Name'); });
    els.sup6Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup6Name); saveSupName('sup6Name'); });
    els.sup7Input.addEventListener('blur', function () { clearTimeout(nameDebounce.sup7Name); saveSupName('sup7Name'); });

    els.forecastPrevBtn.addEventListener('click', function () { shiftForecast(-1); });
    els.forecastNextBtn.addEventListener('click', function () { shiftForecast(1); });
    els.forecastTodayBtn.addEventListener('click', resetForecastToToday);

    ['sup4', 'sup5', 'sup6', 'sup7'].forEach(function (supKey) {
      els.scheduleToggle[supKey].addEventListener('click', function () { togglePerson(supKey); });
    });
  }

  function start() {
    els.statusBanner = q('statusBanner');
    els.sup1Input = q('sup1Input');
    els.sup2Input = q('sup2Input');
    els.sup3Input = q('sup3Input');
    els.sup4Input = q('sup4Input');
    els.sup5Input = q('sup5Input');
    els.sup6Input = q('sup6Input');
    els.sup7Input = q('sup7Input');
    els.foremanList = { sup2: q('foremanList-sup2'), sup3: q('foremanList-sup3'), sup4: q('foremanList-sup4') };

    els.forecastRangeLabel = q('forecastRangeLabel');
    els.forecastPrevBtn = q('forecastPrevBtn');
    els.forecastNextBtn = q('forecastNextBtn');
    els.forecastTodayBtn = q('forecastTodayBtn');
    els.scheduleToggle = { sup4: q('scheduleToggle-sup4'), sup5: q('scheduleToggle-sup5'), sup6: q('scheduleToggle-sup6'), sup7: q('scheduleToggle-sup7') };
    els.schedulePanelSlot = { sup4: q('schedulePanelSlot-sup4'), sup5: q('schedulePanelSlot-sup5'), sup6: q('schedulePanelSlot-sup6'), sup7: q('schedulePanelSlot-sup7') };

    wireStaticControls();
    boot();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
